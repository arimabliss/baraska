    $('#resSuccessNote').textContent = R.success.note;
    $('#reservationReset').textContent = R.success.resetLabel;
  }

  /* ============================================================
     CONTACT
     ============================================================ */
  function socialsHTML(list) {
    return list.map(s =>
      '<a href="' + esc(s.url || '#') + '" class="social-link"' +
        ' aria-label="' + esc('Visit our ' + s.label + ' page') + '"' +
        ' data-social="' + esc(s.label) + '">' +
        '<i class="' + esc(s.icon) + '" aria-hidden="true"></i>' +
      '</a>'
    ).join('');
  }

  function renderContact() {
    const K = C.contact;

    $('#ctEyebrow').textContent = K.eyebrow;
    $('#ctTitle').textContent = K.title;
    $('#ctSub').textContent = K.subtitle;

    $('#contactList').innerHTML = K.items.map(it =>
      '<div class="contact-item">' +
        '<span class="ci-icon"><i class="' + esc(it.icon) + '" aria-hidden="true"></i></span>' +
        '<div>' +
          '<h4>' + esc(it.label) + '</h4>' +
          '<p>' + (it.href
            ? '<a href="' + esc(it.href) + '">' + esc(it.value) + '</a>'
            : esc(it.value)) + '</p>' +
        '</div>' +
      '</div>'
    ).join('');

    $('#contactSocials').innerHTML = socialsHTML(K.socials);

    $('#contactFormTitle').textContent = K.form.title;
    $('#contactFormSub').textContent = K.form.subtitle;

    const F = K.form.fields;
    const req = '<span class="req">*</span>';

    $('#contactFormGrid').innerHTML =
      '<div class="field">' +
        '<label for="ctName">' + esc(F.name.label) + ' ' + (F.name.required ? req : '') + '</label>' +
        '<input type="text" id="ctName" name="name" placeholder="' + esc(F.name.placeholder) + '"' +
          ' autocomplete="name"' + (F.name.required ? ' required' : '') + '>' +
        '<span class="error-msg"></span>' +
      '</div>' +
      '<div class="field">' +
        '<label for="ctEmail">' + esc(F.email.label) + ' ' + (F.email.required ? req : '') + '</label>' +
        '<input type="email" id="ctEmail" name="email" placeholder="' + esc(F.email.placeholder) + '"' +
          ' autocomplete="email"' + (F.email.required ? ' required' : '') + '>' +
        '<span class="error-msg"></span>' +
      '</div>' +
      '<div class="field span-2">' +
        '<label for="ctSubject">' + esc(F.subject.label) + '</label>' +
        '<input type="text" id="ctSubject" name="subject" placeholder="' + esc(F.subject.placeholder) + '">' +
        '<span class="error-msg"></span>' +
      '</div>' +
      '<div class="field span-2">' +
        '<label for="ctMessage">' + esc(F.message.label) + ' ' + (F.message.required ? req : '') + '</label>' +
        '<textarea id="ctMessage" name="message" rows="4" placeholder="' + esc(F.message.placeholder) + '"' +
          (F.message.required ? ' required' : '') + '></textarea>' +
        '<span class="error-msg"></span>' +
      '</div>';

    $('#contactSubmit').innerHTML =
      esc(K.form.submitLabel) + ' <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
    $('#contactSuccessText').textContent = K.form.successMessage;

    const map = $('#mapFrame');
    map.src = K.map.embedUrl;
    map.title = K.map.title;
  }

  /* ============================================================
     NEWSLETTER
     ============================================================ */
  function renderNewsletter() {
    const N = C.newsletter;
    $('#nlEyebrow').textContent = N.eyebrow;
    $('#nlTitle').textContent = N.title;
    $('#nlText').textContent = N.text;
    $('#nlEmail').placeholder = N.placeholder;
    $('#nlSubmit').textContent = N.submitLabel;
    $('#nlNote').textContent = N.note;
    $('#newsletterMsgText').textContent = N.successMessage;
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  function renderFooter() {
    const F = C.footer;

    $('#footerDesc').textContent = F.description;
    $('#footerSocials').innerHTML = socialsHTML(C.contact.socials);

    $('#footerExploreTitle').textContent = F.explore.title;
    $('#footerExploreLinks').innerHTML = F.explore.links.map(l =>
      '<li><a href="' + esc(l.href) + '">' + esc(l.label) + '</a></li>'
    ).join('');

    $('#footerMenuTitle').textContent = F.menuLinks.title;
    $('#footerMenuLinks').innerHTML = F.menuLinks.links.map(l =>
      '<li><a href="#menu" data-menu-jump="' + esc(l.filter) + '">' + esc(l.label) + '</a></li>'
    ).join('');

    $('#footerContactTitle').textContent = F.contact.title;
    $('#footerContactList').innerHTML = F.contact.items.map(it =>
      '<li><i class="' + esc(it.icon) + '" aria-hidden="true"></i>' +
        (it.href ? '<a href="' + esc(it.href) + '">' + esc(it.text) + '</a>' : '<span>' + esc(it.text) + '</span>') +
      '</li>'
    ).join('');

    $('#footerCopyright').textContent = F.copyright
      .replace('{year}', new Date().getFullYear())
      .replace('{name}', C.brand.name);

    $('#footerLegal').innerHTML = F.legal.map(l =>
      '<a href="' + esc(l.href) + '"' + (l.placeholder ? ' data-placeholder="' + esc(l.label) + '"' : '') + '>' +
        esc(l.label) + '</a>'
    ).join('');
  }

  /* ============================================================
     RENDER EVERYTHING
     ============================================================ */
  renderHead();
  renderChrome();
  renderHero();
  renderMarquee();
  renderStory();
  renderSpecialties();
  renderMenu();
  renderWhy();
  renderGallery();
  renderTestimonials();
  renderReservation();
  renderContact();
  renderNewsletter();
  renderFooter();

  /* ============================================================
     LOADER
     ============================================================ */
  function initLoader() {
    const loader = $('#pageLoader');
    if (!loader) return;
    const done = () => loader.classList.add('done');
    window.addEventListener('load', () => setTimeout(done, 320));
    setTimeout(done, 2600);
  }

  /* ============================================================
     TOASTS

  /* ============================================================
     SCROLL REVEAL
     ============================================================ */
  function initReveal() {
    const els = $$('.reveal');
    els.forEach(el => {
      const d = el.getAttribute('data-delay');
      if (d) el.style.transitionDelay = d + 'ms';
    });

    if ('IntersectionObserver' in window && !reduceMotion) {
      const obs = new IntersectionObserver((entries, o) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            o.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
      els.forEach(el => obs.observe(el));
    } else {
      els.forEach(el => el.classList.add('in'));
    }
  }

  /* ============================================================
     COUNTERS
     ============================================================ */
  function initCounters() {
    const counters = $$('.counter');
    if (!counters.length) return;

    const run = (el) => {
      const target = parseInt(el.dataset.target, 10) || 0;
      const duration = 1600;
      const start = performance.now();
      const step = (now) => {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * eased);
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = target;
      };
      requestAnimationFrame(step);
    };

    if ('IntersectionObserver' in window && !reduceMotion) {
      const obs = new IntersectionObserver((entries, o) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { run(entry.target); o.unobserve(entry.target); }
        });
      }, { threshold: 0.6 });
      counters.forEach(c => obs.observe(c));
    } else {
      counters.forEach(c => { c.textContent = c.dataset.target; });
    }
  }

     ============================================================ */
  const menuGrid = $('#menuGrid');

  const emptyText = C.ui.menu.empty;

  function applyFilter(cat) {
    const cards = $$('.menu-card', menuGrid);
    let visibleIndex = 0;
    let visibleCount = 0;

    cards.forEach(card => {
      const match = cat === 'all' || card.dataset.category === cat;
      card.classList.remove('pop-in');
      if (match) {
        card.style.display = '';
        void card.offsetWidth;
        card.style.animationDelay = (visibleIndex % 8) * 45 + 'ms';
        card.classList.add('pop-in');
        visibleIndex++;
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });

    let empty = $('.menu-empty', menuGrid);
    if (visibleCount === 0) {
      if (!empty) {
        empty = document.createElement('p');
        empty.className = 'menu-empty';
        empty.textContent = emptyText;
        menuGrid.appendChild(empty);
      }
    } else if (empty) {
      empty.remove();
    }
  }

        filterBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        applyFilter(btn.dataset.filter);
      });
    });

    $$('[data-menu-jump]').forEach(link => {
      link.addEventListener('click', () => {
        const btn = filterBtns.find(b => b.dataset.filter === link.dataset.menuJump);
        if (btn) setTimeout(() => btn.click(), 500);
      });
    });

    applyFilter('all');
  }

  const cart = {};

  function findItem(id) { return MENU_ITEMS.find(i => i.id === id); }

  function cartTotals() {
    const entries = Object.values(cart);
    return {
      count: entries.reduce((s, e) => s + e.qty, 0),
      subtotal: entries.reduce((s, e) => s + e.item.price * e.qty, 0)
    };
  }

  function countLabel(n) {
    return n + ' ' + (n === 1 ? C.ui.cart.itemSingular : C.ui.cart.itemPlural);
  }

  function renderCart() {
    const { count, subtotal } = cartTotals();

    cartCountEl.textContent = count;
    cartCountEl.classList.toggle('show', count > 0);
    cartCountEl.classList.remove('bump');
    void cartCountEl.offsetWidth;
    if (count > 0) cartCountEl.classList.add('bump');

    cartPill.textContent = countLabel(count);

    const entries = Object.values(cart);

    if (entries.length === 0) {
      cartBody.innerHTML =
        '<div class="cart-empty">' +
          '<div class="ce-icon"><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i></div>' +
          '<h3>' + esc(C.ui.cart.emptyTitle) + '</h3>' +
          '<p>' + esc(C.ui.cart.emptyText) + '</p>' +
          '<button class="btn btn-ghost-dark" id="emptyBrowseBtn" style="margin-top:.5rem;">' +
            esc(C.ui.cart.emptyCta) + '</button>' +
        '</div>';
      cartFoot.style.display = 'none';
      return;
    }

    cartFoot.style.display = '';
    cartBody.innerHTML = entries.map(e =>
      '<div class="cart-item" data-id="' + esc(e.item.id) + '">' +
        '<div class="ci-thumb"><img src="' + esc(e.item.image) + '" alt="' + esc(e.item.name) + '" loading="lazy"></div>' +
        '<div class="ci-info">' +
          '<span class="ci-name">' + esc(e.item.name) + '</span>' +
          '<span class="ci-price">' + money(e.item.price) + ' ' + esc(C.ui.cart.eachLabel) + '</span>' +
          '<div class="qty-row">' +
            '<button class="qty-btn" data-action="dec" data-id="' + esc(e.item.id) + '"' +
              ' aria-label="' + esc('Decrease quantity of ' + e.item.name) + '">' +
              '<i class="fa-solid fa-minus" aria-hidden="true"></i></button>' +
            '<span class="qty-val">' + e.qty + '</span>' +
            '<button class="qty-btn" data-action="inc" data-id="' + esc(e.item.id) + '"' +
              ' aria-label="' + esc('Increase quantity of ' + e.item.name) + '">' +
              '<i class="fa-solid fa-plus" aria-hidden="true"></i></button>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;">' +
          '<button class="ci-remove" data-action="remove" data-id="' + esc(e.item.id) + '"' +
            ' aria-label="' + esc('Remove ' + e.item.name + ' from cart') + '">' +
            '<i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>' +
          '<span class="ci-line-total">' + money(e.item.price * e.qty) + '</span>' +
        '</div>' +
      '</div>'
    ).join('');

    cartSubtotal.textContent = money(subtotal);

  function openCart() {
    cartDrawer.classList.add('open');
    cartDrawer.setAttribute('aria-hidden', 'false');
    drawerOverlay.classList.add('show');
    document.body.classList.add('no-scroll');

  }
  function closeCart() {
    cartDrawer.classList.remove('open');
    cartDrawer.setAttribute('aria-hidden', 'true');

    document.body.classList.remove('no-scroll');

  function initCart() {
    $('#cartToggle').addEventListener('click', openCart);
    $('#cartClose').addEventListener('click', closeCart);
    drawerOverlay.addEventListener('click', closeCart);

    /* add-to-cart */
    menuGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('.add-btn');
      if (!btn) return;
      const item = findItem(btn.dataset.id);
      if (!item) return;

      if (cart[item.id]) cart[item.id].qty += 1;
      else cart[item.id] = { item: item, qty: 1 };
      renderCart();
      showToast(C.ui.toasts.added.replace('{name}', item.name));

      btn.classList.add('added');
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i> ' + esc(C.ui.cart.addedLabel);
      setTimeout(() => {
        btn.classList.remove('added');
        btn.innerHTML = original;
      }, 1300);
    });

    /* cart body actions */
    cartBody.addEventListener('click', (e) => {
      const browse = e.target.closest('#emptyBrowseBtn');
      if (browse) {
        closeCart();
        document.querySelector('#menu').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
        return;
      }
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (!cart[id]) return;

      if (action === 'inc') {
        cart[id].qty += 1;
      } else if (action === 'dec') {
        cart[id].qty -= 1;
        if (cart[id].qty <= 0) delete cart[id];
      } else if (action === 'remove') {
        const name = cart[id].item.name;
        delete cart[id];
        showToast(C.ui.toasts.removed.replace('{name}', name));
      }
      renderCart();
    });

    clearCartBtn.addEventListener('click', () => {
      if (Object.keys(cart).length === 0) return;
      Object.keys(cart).forEach(k => delete cart[k]);
      renderCart();
      showToast(C.ui.toasts.cleared);
    });

    checkoutBtn.addEventListener('click', () => {
      const { count, subtotal } = cartTotals();
      if (count === 0) {
        showToast(C.ui.toasts.emptyCart);
        return;
      }
      showToast(
        C.ui.toasts.checkout
          .replace('{count}', count)
          .replace('{total}', money(subtotal))
      );
      checkoutBtn.textContent = C.ui.cart.checkoutDemoLabel;
      checkoutBtn.disabled = true;
      setTimeout(() => {
        checkoutBtn.textContent = C.ui.cart.checkoutLabel;
        checkoutBtn.disabled = false;
      }, 2600);
    });

    renderCart();
  }

  /* ============================================================
     LIGHTBOX
     ============================================================ */
  function initLightbox() {
    const items = $$('.g-item');
    const lightbox  = $('#lightbox');
    const lbImg     = $('#lbImg');
    const lbCaption = $('#lbCaption');
    let index = 0;

    function paint(i) {
      const item = items[i];
      lbCaption.textContent = item.dataset.caption || '';
      lbImg.style.opacity = '0';
      setTimeout(() => {
        lbImg.src = item.dataset.src;
        lbImg.alt = item.querySelector('img').alt;
        lbImg.style.opacity = '1';
      }, 140);
    }

    function open(i) {
      index = i;
      paint(index);
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('no-scroll');
      setTimeout(() => $('#lbClose').focus(), 240);
    }
    function close() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('no-scroll');
    }
    function next() { index = (index + 1) % items.length; paint(index); }
    function prev() { index = (index - 1 + items.length) % items.length; paint(index); }

    items.forEach((item, i) => item.addEventListener('click', () => open(i)));

    $('#lbClose').addEventListener('click', close);
    $('#lbNext').addEventListener('click', next);
    $('#lbPrev').addEventListener('click', prev);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) close(); });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });
  }

  /* ============================================================
     TESTIMONIAL SLIDER
     ============================================================ */
  function initSlider() {
    const track = $('#sliderTrack');
    const dotsWrap = $('#sliderDots');
    const slides = $$('.slide', track);
    if (!slides.length) return;

    let current = 0;
    let autoplayId = null;

    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('role', 'tab');
      dot.setAttribute('aria-label', 'Go to testimonial ' + (i + 1));
      dot.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      dot.addEventListener('click', () => { goTo(i); restart(); });
      dotsWrap.appendChild(dot);
    });
    const dots = $$('.dot', dotsWrap);

    function goTo(i) {
      current = (i + slides.length) % slides.length;
      track.style.transform = 'translateX(' + (-current * 100) + '%)';
      dots.forEach((d, k) => {
        d.classList.toggle('active', k === current);
        d.setAttribute('aria-selected', k === current ? 'true' : 'false');
      });
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function start() {
      if (reduceMotion) return;
      autoplayId = setInterval(next, C.testimonials.autoplayMs || 6500);
    }
    function restart() { clearInterval(autoplayId); start(); }

    $('#nextSlide').addEventListener('click', () => { next(); restart(); });
    $('#prevSlide').addEventListener('click', () => { prev(); restart(); });

    const sliderEl = track.closest('.slider');
    sliderEl.addEventListener('mouseenter', () => clearInterval(autoplayId));
    sliderEl.addEventListener('mouseleave', start);
    sliderEl.addEventListener('focusin', () => clearInterval(autoplayId));

    let startX = 0;
    track.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; }, { passive: true });
    track.addEventListener('touchend', e => {
      const delta = startX - e.changedTouches[0].screenX;
      if (Math.abs(delta) > 55) { delta > 0 ? next() : prev(); restart(); }
    }, { passive: true });

    goTo(0);
    start();
  }

  /* ============================================================
     VALIDATION HELPERS
     ============================================================ */
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
  const PHONE_RE = /^[+()\-\s\d]{7,20}$/;

  function fieldOf(input) { return input.closest('.field'); }

  function setError(input, message) {
    const field = fieldOf(input);
    if (!field) return;
    field.classList.add('invalid');
    const msg = field.querySelector('.error-msg');
    if (msg) msg.textContent = message;
    input.setAttribute('aria-invalid', 'true');
  }
  function clearError(input) {
    const field = fieldOf(input);
    if (!field) return;
    field.classList.remove('invalid');
    const msg = field.querySelector('.error-msg');
    if (msg) msg.textContent = '';
    input.removeAttribute('aria-invalid');
  }

  const V = C.ui.validation;

  function validateName(input) {
    const v = input.value.trim();
    if (!v) { setError(input, V.nameRequired); return false; }
    if (v.length < 2) { setError(input, V.nameShort); return false; }
    clearError(input); return true;
  }
  function validateEmail(input) {
    const v = input.value.trim();
    if (!v) { setError(input, V.emailRequired); return false; }
    if (!EMAIL_RE.test(v)) { setError(input, V.emailInvalid); return false; }
    clearError(input); return true;
  }
  function validatePhone(input) {
    const v = input.value.trim();
    if (!v) { setError(input, V.phoneRequired); return false; }
    if (!PHONE_RE.test(v) || v.replace(/\D/g, '').length < 7) {
      setError(input, V.phoneInvalid); return false;
    }
    clearError(input); return true;
  }
  function validateSelect(input, message) {
    if (!input.value) { setError(input, message); return false; }
    clearError(input); return true;
  }
  function validateTextarea(input, min) {
    const v = input.value.trim();
    if (!v) { setError(input, V.messageRequired); return false; }
    if (v.length < min) { setError(input, V.messageShort.replace('{min}', min)); return false; }
    clearError(input); return true;
  }

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.closest && t.closest('.field.invalid')) clearError(t);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.closest && t.closest('.field.invalid')) clearError(t);
  });

  /* ============================================================
     RESERVATION FORM
     ============================================================ */
  function initReservation() {
    const form = $('#reservationForm');
    const success = $('#reservationSuccess');
    const summary = $('#resSuccessMessage');
    const dateInput = $('#resDate');
    const R = C.reservation;

    /* date window */
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const maxDate = new Date(today);
    maxDate.setDate(maxDate.getDate() + (R.fields.date.maxDaysAhead || 60));
    const minDate = new Date(today);
    minDate.setDate(minDate.getDate() + (R.fields.date.minDaysAhead || 0));

    const toISO = d => d.toISOString().split('T')[0];
    dateInput.min = toISO(minDate);
    dateInput.max = toISO(maxDate);

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name   = $('#resName');
      const email  = $('#resEmail');
      const phone  = $('#resPhone');
      const guests = $('#resGuests');
      const date   = $('#resDate');
      const time   = $('#resTime');

      let valid = true;
      valid = validateName(name) && valid;
      valid = validateEmail(email) && valid;
      valid = validatePhone(phone) && valid;
      valid = validateSelect(guests, V.guestsRequired) && valid;
      valid = validateSelect(time, V.timeRequired) && valid;

      if (!date.value) {
        setError(date, V.dateRequired);
        valid = false;
      } else {
        const chosen = new Date(date.value + 'T00:00:00');
        if (chosen < minDate) {
          setError(date, V.datePast);
          valid = false;
        } else if (chosen > maxDate) {
          setError(date, V.dateFar.replace('{days}', R.fields.date.maxDaysAhead || 60));
          valid = false;
        } else {
          clearError(date);
        }
      }

      if (!valid) {
        const first = form.querySelector('.field.invalid input, .field.invalid select');
        if (first) first.focus();
        return;
      }

      const guestLabel = guests.options[guests.selectedIndex].text;
      const dateLabel = new Date(date.value + 'T00:00:00').toLocaleDateString(C.locale, {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      summary.textContent = R.success.message
        .replace('{firstName}', name.value.trim().split(' ')[0])
        .replace('{guests}', guestLabel)
        .replace('{date}', dateLabel)
        .replace('{time}', time.value);

      success.classList.add('show');
      showToast(C.ui.toasts.reservation);
    });

    $('#reservationReset').addEventListener('click', () => {
      form.reset();
      $$('.field', form).forEach(f => f.classList.remove('invalid'));
      success.classList.remove('show');
      $('#resName').focus();
    });
  }

        showToast(C.ui.toasts.placeholder.replace('{label}', ph.dataset.placeholder));
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('#lightbox').classList.contains('open')) return;
        if (cartDrawer.classList.contains('open')) closeCart();
        if (mobileMenu.classList.contains('open')) closeMobileMenu();
      }
    });
  }

  /* ============================================================
     BOOT
     ============================================================ */
  initLoader();
  onScroll();
  initReveal();
  initCounters();
  initMenuFilters();
  initCart();
  initLightbox();
  initSlider();
  initReservation();
  initContactForm();
  initNewsletter();
  initMisc();

})();
</script>
</body>
</html>
