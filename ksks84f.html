<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --ink:#14100d;
  --charcoal:#1b1613;
  --charcoal-soft:#241e1a;
  --charcoal-deep:#100d0b;
  --cream:#f3ece0;
  --ivory:#fbf8f2;
  --gold:#c0a068;
  --gold-soft:#d9c39a;
  --gold-deep:#9c7c46;
  --terra:#b4653f;
  --text:#1c1714;
  --muted:#7a6e63;
  --line:rgba(28,23,20,.13);
  --line-soft:rgba(28,23,20,.07);
  --shadow-sm:0 6px 24px -12px rgba(20,16,13,.25);
  --shadow-md:0 26px 60px -30px rgba(20,16,13,.45);
  --shadow-lg:0 40px 90px -40px rgba(20,16,13,.55);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,.7,.28,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --nav-h:88px;
}

/* ============================================================
   2. RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);font-weight:300;font-size:1rem;line-height:1.75;
  color:var(--text);background:var(--ivory);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
body.no-scroll{overflow:hidden}
img{max-width:100%;display:block;height:auto}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
ul{list-style:none}
::selection{background:var(--gold);color:var(--charcoal)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--cream)}
::-webkit-scrollbar-thumb{background:#c9bda9;border-radius:10px;border:2px solid var(--cream)}
::-webkit-scrollbar-thumb:hover{background:var(--gold-deep)}

/* ============================================================
   3. LAYOUT HELPERS
   ============================================================ */
.container{width:min(1280px,100% - 2.75rem);margin-inline:auto}
.section{padding:clamp(4.5rem,9vw,8.5rem) 0;position:relative}
.section--tight{padding:clamp(3.5rem,7vw,6rem) 0}
.section--cream{background:var(--cream)}
.section--dark{background:var(--charcoal);color:var(--cream)}
.section--dark .eyebrow{color:var(--gold-soft)}
.section--dark .section-sub{color:rgba(243,236,224,.62)}

/* ============================================================
   4. TYPOGRAPHY
   ============================================================ */
.display{font-family:var(--serif);font-weight:400;line-height:1.06;letter-spacing:-.012em}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.15;letter-spacing:-.01em}
.eyebrow{
  font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;font-weight:500;
  color:var(--gold-deep);display:inline-flex;align-items:center;gap:.85rem;
}
.eyebrow::before{content:"";width:32px;height:1px;background:currentColor;opacity:.6;display:inline-block}
.eyebrow--center::after{content:"";width:32px;height:1px;background:currentColor;opacity:.6;display:inline-block}
.section-head{max-width:720px;margin-bottom:clamp(2.5rem,5vw,4rem)}
.section-head--center{margin-inline:auto;text-align:center}
.section-title{font-size:clamp(2.1rem,4.6vw,3.65rem);margin:1.1rem 0 1.1rem}
.section-sub{color:var(--muted);font-size:1rem;max-width:58ch;line-height:1.85}
.section-head--center .section-sub{margin-inline:auto}

/* ============================================================
   5. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.75rem;
  padding:1.05rem 2.2rem;font-size:.72rem;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;border:1px solid transparent;border-radius:1px;
  cursor:pointer;position:relative;overflow:hidden;white-space:nowrap;line-height:1;
  transition:color .45s var(--ease),background .45s var(--ease),border-color .45s var(--ease),transform .45s var(--ease),box-shadow .45s var(--ease);
}
.btn i{font-size:.85em;transition:transform .45s var(--ease)}
.btn:hover i.fa-arrow-right{transform:translateX(4px)}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#1a1512;border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-soft);border-color:var(--gold-soft);box-shadow:0 18px 40px -20px rgba(192,160,104,.9)}
.btn-dark{background:var(--charcoal);color:var(--cream);border-color:var(--charcoal)}
.btn-dark:hover{background:var(--charcoal-deep);border-color:var(--charcoal-deep);box-shadow:var(--shadow-md)}
.btn-ghost-light{color:var(--cream);border-color:rgba(243,236,224,.42)}
.btn-ghost-light:hover{background:var(--cream);color:var(--charcoal);border-color:var(--cream)}
.btn-ghost-dark{color:var(--text);border-color:rgba(28,23,20,.3)}
.btn-ghost-dark:hover{background:var(--charcoal);color:var(--cream);border-color:var(--charcoal)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-link{
  display:inline-block;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid transparent;padding-bottom:2px;transition:.35s var(--ease);
}
.btn-link:hover{color:var(--terra);border-bottom-color:var(--terra)}
.icon-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;transition:.4s var(--ease);color:inherit}
.icon-btn:hover{background:rgba(0,0,0,.06)}

/* ============================================================
   6. PAGE LOADER
   ============================================================ */
.page-loader{
  position:fixed;inset:0;z-index:3000;background:var(--charcoal);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .8s var(--ease),visibility .8s;
}
.page-loader.done{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{font-family:var(--serif);font-size:2.6rem;color:var(--gold);letter-spacing:.2em;animation:pulseMark 1.6s ease-in-out infinite}
@keyframes pulseMark{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}

/* ============================================================
   7. HEADER / NAVIGATION
   ============================================================ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:900;padding:1.35rem 0;
  border-bottom:1px solid transparent;
  transition:background .55s var(--ease),padding .55s var(--ease),box-shadow .55s var(--ease),border-color .55s var(--ease);
}
.site-header::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,8,6,.55),rgba(10,8,6,0));
  opacity:1;transition:opacity .55s var(--ease);
}
.site-header.scrolled::before{opacity:0}
.site-header.scrolled{
  background:rgba(251,248,242,.93);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 14px 40px -28px rgba(20,16,13,.6);
  border-bottom-color:var(--line);padding:.72rem 0;
}
.nav-wrap{
  width:min(1400px,100% - 2.5rem);margin-inline:auto;display:flex;
  align-items:center;justify-content:space-between;gap:1.75rem;position:relative;z-index:2;
}
.brand{display:flex;align-items:center;gap:.8rem;flex-shrink:0}
.brand-mark{
  width:44px;height:44px;border:1px solid var(--gold);display:grid;place-items:center;
  font-family:var(--serif);font-size:1.05rem;color:var(--gold);flex-shrink:0;
  transition:.5s var(--ease);background:rgba(192,160,104,.08);
}
.brand:hover .brand-mark{background:var(--gold);color:var(--charcoal)}
.brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-name{font-family:var(--serif);font-size:1.28rem;letter-spacing:.06em;color:#fff;transition:color .5s var(--ease);white-space:nowrap}
.brand-sub{font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-top:.28rem;transition:color .5s var(--ease);white-space:nowrap}
.site-header.scrolled .brand-name{color:var(--text)}
.site-header.scrolled .brand-sub{color:var(--muted)}

.nav-links{display:flex;align-items:center;gap:2rem}
.nav-links a{
  font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:400;
  color:rgba(255,255,255,.86);position:relative;padding:.35rem 0;transition:color .4s var(--ease);
}
.nav-links a::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--gold);
  transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease-out);
}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);transform-origin:left}
.nav-links a:hover{color:#fff}
.site-header.scrolled .nav-links a{color:rgba(28,23,20,.78)}
.site-header.scrolled .nav-links a:hover,.site-header.scrolled .nav-links a.active{color:var(--text)}

.nav-actions{display:flex;align-items:center;gap:.9rem;flex-shrink:0}
.cart-btn{
  position:relative;width:44px;height:44px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.3);border-radius:50%;color:#fff;transition:.45s var(--ease);
}
.cart-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
.site-header.scrolled .cart-btn{color:var(--text);border-color:rgba(28,23,20,.2)}
.site-header.scrolled .cart-btn:hover{background:rgba(28,23,20,.06);border-color:rgba(28,23,20,.4)}
.cart-count{
  position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:20px;
  background:var(--gold);color:#1a1512;font-size:.66rem;font-weight:600;display:grid;place-items:center;
  transform:scale(0);transition:transform .4s var(--ease-out);font-family:var(--sans);
}
.cart-count.show{transform:scale(1)}
.cart-count.bump{animation:bump .45s var(--ease-out)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.nav-cta{padding:.9rem 1.6rem;font-size:.68rem}

.hamburger{
  display:none;width:44px;height:44px;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;border:1px solid rgba(255,255,255,.3);border-radius:50%;transition:.45s var(--ease);
}
.site-header.scrolled .hamburger{border-color:rgba(28,23,20,.2)}
.hamburger span{display:block;width:17px;height:1.5px;background:#fff;transition:.45s var(--ease);transform-origin:center}
.site-header.scrolled .hamburger span{background:var(--text)}

.mobile-menu{
  position:fixed;inset:0;z-index:1000;background:var(--charcoal);
  display:flex;flex-direction:column;justify-content:center;padding:6rem 2rem 3rem;
  transform:translateX(100%);visibility:hidden;overflow-y:auto;
  transition:transform .65s var(--ease-out),visibility .65s;
}
.mobile-menu.open{transform:translateX(0);visibility:visible}
.mm-close{
  position:absolute;top:1.4rem;right:1.4rem;width:48px;height:48px;display:grid;place-items:center;
  border:1px solid rgba(243,236,224,.25);border-radius:50%;color:var(--cream);font-size:1.1rem;transition:.4s var(--ease);
}
.mm-close:hover{background:var(--cream);color:var(--charcoal)}
.mm-links{display:flex;flex-direction:column;gap:.1rem}
.mm-links a{
  font-family:var(--serif);font-size:clamp(1.9rem,8vw,2.6rem);color:var(--cream);
  padding:.42rem 0;border-bottom:1px solid rgba(243,236,224,.1);transition:.4s var(--ease);
  display:flex;align-items:center;justify-content:space-between;
}
.mm-links a span{font-family:var(--sans);font-size:.65rem;letter-spacing:.2em;color:var(--gold);opacity:.6}
.mm-links a:hover{color:var(--gold);padding-left:.6rem}
.mm-footer{margin-top:2.5rem;display:flex;flex-direction:column;gap:1.25rem}
.mm-contact{font-size:.82rem;color:rgba(243,236,224,.6);letter-spacing:.06em;line-height:2}
.mm-contact a:hover{color:var(--gold)}

/* ============================================================
   8. HERO
   ============================================================ */
.hero{position:relative;min-height:100svh;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:var(--charcoal-deep)}
.hero-media{position:absolute;inset:0;z-index:0}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 45%;animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.2%,-1.5%,0)}}
.hero-overlay{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(to right,rgba(12,9,7,.88) 0%,rgba(12,9,7,.62) 45%,rgba(12,9,7,.32) 100%),
    linear-gradient(to top,rgba(12,9,7,.85) 0%,rgba(12,9,7,0) 45%);
}
.hero-content{position:relative;z-index:2;padding-top:calc(var(--nav-h) + 2rem);padding-bottom:6rem;max-width:900px}
.hero .eyebrow{color:var(--gold-soft)}
.hero-title{font-size:clamp(2.6rem,7.6vw,6rem);color:#fff;margin:1.4rem 0 1.6rem;line-height:1.02;letter-spacing:-.02em;max-width:16ch}
.hero-title em{font-style:italic;color:var(--gold-soft);display:inline}
.hero-lede{color:rgba(255,255,255,.76);font-size:clamp(.95rem,1.4vw,1.08rem);max-width:52ch;line-height:1.85;font-weight:300}
.hero-actions{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2.6rem}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:2.5rem;margin-top:4rem;padding-top:2rem;
  border-top:1px solid rgba(255,255,255,.14);max-width:680px;
}
.hero-meta-item{display:flex;flex-direction:column;gap:.3rem}
.hero-meta-item .k{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-soft)}
.hero-meta-item .v{font-family:var(--serif);font-size:1.15rem;color:rgba(255,255,255,.9)}
.scroll-cue{
  position:absolute;left:50%;bottom:2rem;transform:translateX(-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:.7rem;color:rgba(255,255,255,.55);
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;transition:color .4s var(--ease);
}
.scroll-cue:hover{color:var(--gold)}
.scroll-cue .bar{width:1px;height:52px;background:linear-gradient(to bottom,rgba(255,255,255,.5),rgba(255,255,255,0));position:relative;overflow:hidden}
.scroll-cue .bar::after{
  content:"";position:absolute;top:0;left:0;width:1px;height:18px;background:var(--gold);
  animation:scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown{0%{transform:translateY(-20px);opacity:0}35%{opacity:1}100%{transform:translateY(52px);opacity:0}}

/* ============================================================
   9. MARQUEE
   ============================================================ */
.marquee{
  background:var(--charcoal);color:var(--cream);padding:1.05rem 0;overflow:hidden;
  border-top:1px solid rgba(243,236,224,.08);border-bottom:1px solid rgba(243,236,224,.08);
}
.marquee-track{display:flex;width:max-content;animation:marquee 42s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{
  font-family:var(--serif);font-size:1.05rem;letter-spacing:.16em;text-transform:uppercase;
  padding:0 1.6rem;white-space:nowrap;color:rgba(243,236,224,.72);
  display:flex;align-items:center;gap:1.6rem;
}
.marquee-track span::after{content:"✦";color:var(--gold);font-size:.7rem;letter-spacing:0}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============================================================
   10. STORY
   ============================================================ */
.story-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2.5rem,6vw,5.5rem);align-items:center}
.story-images{position:relative;padding-bottom:3.5rem}
.story-img-main{position:relative;overflow:hidden;aspect-ratio:4/4.6;box-shadow:var(--shadow-lg)}
.story-img-main img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.story-images:hover .story-img-main img{transform:scale(1.045)}
.story-img-sub{
  position:absolute;right:-1rem;bottom:0;width:56%;aspect-ratio:1/1;overflow:hidden;
  border:8px solid var(--ivory);box-shadow:var(--shadow-md);
}
.story-img-sub img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.story-images:hover .story-img-sub img{transform:scale(1.06)}
.story-badge{
  position:absolute;left:-1.2rem;top:2.2rem;background:var(--charcoal);color:var(--cream);
  padding:1.2rem 1.4rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;
  box-shadow:var(--shadow-md);z-index:2;
}
.story-badge .num{font-family:var(--serif);font-size:1.9rem;color:var(--gold);line-height:1}
.story-badge .lbl{font-size:.55rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(243,236,224,.6);text-align:center;line-height:1.5}
.story-copy .section-title{margin-top:1.1rem}
.story-copy p{color:var(--muted);margin-bottom:1.15rem;line-height:1.9}
.story-quote{
  border-left:2px solid var(--gold);padding:.4rem 0 .4rem 1.6rem;margin:2rem 0;
  font-family:var(--serif);font-size:clamp(1.2rem,2.2vw,1.55rem);font-style:italic;line-height:1.5;color:var(--text);
}
.story-sign{display:flex;align-items:center;gap:1rem;margin-top:2rem;padding-top:1.75rem;border-top:1px solid var(--line)}
.story-sign .sig{font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--charcoal)}
.story-sign .role{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;
  margin-top:clamp(3rem,6vw,5rem);padding-top:clamp(2.5rem,5vw,3.5rem);border-top:1px solid var(--line);
}
.stat{text-align:center}
.stat .num{
  font-family:var(--serif);font-size:clamp(2.2rem,4.4vw,3.4rem);color:var(--charcoal);line-height:1;
  display:flex;justify-content:center;align-items:baseline;gap:.1rem;
}
.stat .num .suffix{color:var(--gold);font-size:.6em}
.stat .lbl{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:.85rem;display:block}

/* ============================================================
   11. SPECIALTIES
   ============================================================ */
.specialties{position:relative;overflow:hidden}
.specialty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.2rem,2.4vw,2rem)}
.specialty-card{
  position:relative;overflow:hidden;background:var(--charcoal-soft);
  display:flex;flex-direction:column;min-height:520px;isolation:isolate;
}
.specialty-card .sp-media{position:absolute;inset:0;z-index:0}
.specialty-card .sp-media img{width:100%;height:100%;object-fit:cover;transition:transform 1.5s var(--ease);filter:brightness(.72)}
.specialty-card:hover .sp-media img{transform:scale(1.08);filter:brightness(.6)}
.specialty-card::after{
  content:"";position:absolute;inset:0;z-index:1;transition:opacity .6s var(--ease);
  background:linear-gradient(to top,rgba(10,8,6,.92) 8%,rgba(10,8,6,.45) 45%,rgba(10,8,6,.2) 100%);
}
.specialty-card .sp-body{position:relative;z-index:2;margin-top:auto;padding:clamp(1.6rem,3vw,2.4rem);color:var(--cream)}
.sp-label{
  display:inline-block;font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(192,160,104,.5);padding:.35rem .75rem;margin-bottom:1.1rem;
}
.sp-name{font-family:var(--serif);font-size:clamp(1.4rem,2.4vw,1.85rem);line-height:1.2;margin-bottom:.65rem;color:#fff}
.sp-desc{
  font-size:.86rem;color:rgba(243,236,224,.68);line-height:1.75;max-height:0;overflow:hidden;opacity:0;
  transition:max-height .6s var(--ease),opacity .5s var(--ease),margin .5s var(--ease);
}
.specialty-card:hover .sp-desc,.specialty-card:focus-within .sp-desc{max-height:120px;opacity:1;margin-bottom:1rem}
.sp-price{font-family:var(--serif);font-size:1.5rem;color:var(--gold-soft);display:block;margin-top:.4rem}
.specialties-cta{margin-top:clamp(2.5rem,5vw,3.5rem);text-align:center}

/* ============================================================
   12. MENU
   ============================================================ */
.menu-toolbar{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-bottom:clamp(2.2rem,4vw,3.2rem)}
.filter-btn{
  padding:.72rem 1.5rem;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:400;
  border:1px solid var(--line);border-radius:40px;color:var(--muted);background:transparent;
  transition:.42s var(--ease);white-space:nowrap;
}
.filter-btn:hover{border-color:var(--gold);color:var(--text)}
.filter-btn.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--cream)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:clamp(1.2rem,2.4vw,1.9rem)}
.menu-card{
  background:#fff;border:1px solid var(--line-soft);display:flex;flex-direction:column;overflow:hidden;
  transition:transform .6s var(--ease),box-shadow .6s var(--ease),border-color .6s var(--ease);will-change:transform;
}
.menu-card:hover{transform:translateY(-7px);box-shadow:var(--shadow-md);border-color:rgba(192,160,104,.45)}
.menu-card.pop-in{animation:cardIn .6s var(--ease-out) both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.menu-card .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--cream)}
.menu-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.menu-card:hover .thumb img{transform:scale(1.09)}
.menu-card .thumb::after{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s var(--ease);
  background:linear-gradient(to top,rgba(10,8,6,.4),transparent 42%);
}
.menu-card:hover .thumb::after{opacity:1}
.tags{position:absolute;top:.8rem;left:.8rem;display:flex;flex-wrap:wrap;gap:.35rem;z-index:2}
.tag{
  font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;font-weight:500;
  padding:.3rem .6rem;border-radius:2px;line-height:1.2;backdrop-filter:blur(4px);
}
.tag-veg{background:rgba(74,124,89,.92);color:#fff}
.tag-best{background:rgba(192,160,104,.95);color:#231c14}
.tag-spicy{background:rgba(180,101,63,.94);color:#fff}
.card-body{padding:1.35rem 1.4rem 1.4rem;display:flex;flex-direction:column;flex:1;gap:.6rem}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.dish-name{font-family:var(--serif);font-size:1.22rem;line-height:1.25;color:var(--charcoal);letter-spacing:-.005em}
.dish-price{font-family:var(--serif);font-size:1.22rem;color:var(--gold-deep);white-space:nowrap;line-height:1.25}
.dish-desc{font-size:.83rem;color:var(--muted);line-height:1.7;flex:1}
.add-btn{
  margin-top:.5rem;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.82rem 1rem;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;
  border:1px solid var(--line);color:var(--charcoal);background:transparent;transition:.42s var(--ease);width:100%;
}
.add-btn:hover{background:var(--charcoal);border-color:var(--charcoal);color:var(--cream)}
.add-btn.added{background:var(--gold);border-color:var(--gold);color:#1a1512}
.add-btn i{font-size:.78em;transition:transform .4s var(--ease)}
.add-btn:hover i{transform:rotate(90deg)}
.menu-empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted);font-size:.95rem}

/* ============================================================
   13. WHY CHOOSE US
   ============================================================ */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(243,236,224,.13);border:1px solid rgba(243,236,224,.13)}
.why-card{background:var(--charcoal);padding:clamp(2rem,3.4vw,3rem) clamp(1.4rem,2.4vw,2.2rem);transition:background .55s var(--ease);position:relative;overflow:hidden}
.why-card::before{
  content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:var(--gold);
  transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease-out);
}
.why-card:hover{background:var(--charcoal-soft)}
.why-card:hover::before{transform:scaleX(1)}
.why-icon{
  width:58px;height:58px;display:grid;place-items:center;border:1px solid rgba(192,160,104,.35);
  border-radius:50%;color:var(--gold);font-size:1.25rem;margin-bottom:1.6rem;transition:.55s var(--ease);
}
.why-card:hover .why-icon{background:var(--gold);color:var(--charcoal);border-color:var(--gold);transform:translateY(-3px)}
.why-card h3{font-size:1.32rem;color:var(--cream);margin-bottom:.75rem}
.why-card p{font-size:.86rem;color:rgba(243,236,224,.6);line-height:1.8}

/* ============================================================
   14. GALLERY
   ============================================================ */
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:.85rem}
.g-item{position:relative;overflow:hidden;cursor:pointer;background:var(--cream);padding:0;border:none;display:block}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform 1.3s var(--ease),filter .7s var(--ease)}
.g-item::after{content:"";position:absolute;inset:0;background:rgba(12,9,7,.55);opacity:0;transition:opacity .5s var(--ease)}
.g-item:hover img{transform:scale(1.09)}
.g-item:hover::after{opacity:1}
.g-item .g-zoom{
  position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:1.2rem;
  opacity:0;transform:scale(.7);transition:opacity .5s var(--ease),transform .5s var(--ease-out);z-index:2;pointer-events:none;
}
.g-item:hover .g-zoom{opacity:1;transform:scale(1)}
.g-item .g-cap{
  position:absolute;bottom:1rem;left:1.1rem;z-index:2;color:#fff;font-size:.68rem;
  letter-spacing:.2em;text-transform:uppercase;opacity:0;transform:translateY(8px);
  transition:.5s var(--ease);pointer-events:none;
}
.g-item:hover .g-cap{opacity:1;transform:none}
.g-tall{grid-row:span 2}
.g-wide{grid-column:span 2}

.lightbox{
  position:fixed;inset:0;z-index:1500;background:rgba(10,8,6,.96);
  display:flex;align-items:center;justify-content:center;padding:clamp(1rem,5vw,4rem);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s;
}
.lightbox.open{opacity:1;visibility:visible}
.lb-figure{max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:1rem}
.lb-figure img{
  max-width:100%;max-height:78vh;object-fit:contain;box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
  transform:scale(.96);opacity:0;transition:transform .5s var(--ease-out),opacity .5s var(--ease);
}
.lightbox.open .lb-figure img{transform:scale(1);opacity:1}
.lb-figure figcaption{color:rgba(243,236,224,.72);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;text-align:center}
.lb-close{
  position:absolute;top:1.4rem;right:1.4rem;width:50px;height:50px;display:grid;place-items:center;
  border:1px solid rgba(243,236,224,.25);border-radius:50%;color:var(--cream);font-size:1.1rem;
  transition:.4s var(--ease);z-index:3;
}
.lb-close:hover{background:var(--cream);color:var(--charcoal)}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;display:grid;place-items:center;
  border:1px solid rgba(243,236,224,.25);border-radius:50%;color:var(--cream);transition:.4s var(--ease);z-index:3;
}
.lb-nav:hover{background:var(--gold);border-color:var(--gold);color:#1a1512}
.lb-prev{left:clamp(.6rem,3vw,2.2rem)}
.lb-next{right:clamp(.6rem,3vw,2.2rem)}

/* ============================================================
   15. TESTIMONIALS
   ============================================================ */
.testimonials{position:relative;overflow:hidden}
.testimonials::before{
  content:"“";position:absolute;top:2%;left:50%;transform:translateX(-50%);
  font-family:var(--serif);font-size:clamp(16rem,30vw,26rem);line-height:1;
  color:rgba(192,160,104,.07);pointer-events:none;user-select:none;
}
.slider{position:relative;max-width:880px;margin-inline:auto;z-index:2}
.slider-viewport{overflow:hidden}
.slider-track{display:flex;transition:transform .8s var(--ease-out);will-change:transform}
.slide{flex:0 0 100%;padding:0 clamp(.4rem,2vw,1.5rem)}
.testimonial-card{text-align:center;padding:clamp(1.5rem,3vw,2.5rem) 0}
.t-stars{display:flex;justify-content:center;gap:.35rem;color:var(--gold);font-size:.78rem;margin-bottom:1.6rem}
.t-quote{
  font-family:var(--serif);font-size:clamp(1.2rem,2.7vw,1.75rem);line-height:1.6;
  font-style:italic;color:rgba(243,236,224,.92);margin-bottom:2rem;
}
.t-person{display:flex;align-items:center;justify-content:center;gap:1rem}
.t-avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;border:1px solid rgba(192,160,104,.5);flex-shrink:0}
.t-avatar img{width:100%;height:100%;object-fit:cover}
.t-name{font-size:.92rem;letter-spacing:.06em;color:var(--cream);text-align:left;display:block}
.t-role{font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,236,224,.45);text-align:left;display:block;margin-top:.2rem}
.slider-nav{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:2rem}
.slider-arrow{
  width:46px;height:46px;display:grid;place-items:center;border:1px solid rgba(243,236,224,.22);
  border-radius:50%;color:var(--cream);transition:.4s var(--ease);font-size:.85rem;
}
.slider-arrow:hover{background:var(--gold);border-color:var(--gold);color:#1a1512}
.slider-dots{display:flex;gap:.55rem}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(243,236,224,.28);transition:.4s var(--ease);padding:0}
.dot.active{background:var(--gold);width:26px;border-radius:6px}

/* ============================================================
   16. RESERVATION
   ============================================================ */
.reservation{position:relative;background:var(--charcoal-deep);color:var(--cream);overflow:hidden}
.reservation-bg{position:absolute;inset:0;z-index:0}
.reservation-bg img{width:100%;height:100%;object-fit:cover;opacity:.24;filter:grayscale(.35)}
.reservation::after{
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(120deg,rgba(16,13,11,.95) 0%,rgba(16,13,11,.82) 55%,rgba(16,13,11,.68) 100%);
}
.reservation .container{position:relative;z-index:2}
.res-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(2.5rem,6vw,5rem);align-items:start}
.res-intro .section-title{color:var(--cream);margin-top:1.1rem}
.res-intro p{color:rgba(243,236,224,.65);line-height:1.9;margin-bottom:1.5rem}
.res-detail{display:flex;gap:1rem;padding:1.1rem 0;border-bottom:1px solid rgba(243,236,224,.12);align-items:flex-start}
.res-detail i{color:var(--gold);font-size:.95rem;margin-top:.35rem;width:20px;flex-shrink:0}
.res-detail strong{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,236,224,.5);font-weight:500;margin-bottom:.2rem}
.res-detail span{font-size:.92rem;color:rgba(243,236,224,.88);line-height:1.6}
.res-form-wrap{
  background:rgba(27,22,19,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(243,236,224,.14);padding:clamp(1.6rem,3.4vw,2.8rem);position:relative;overflow:hidden;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.15rem}
.field{display:flex;flex-direction:column;gap:.5rem;position:relative}
.field.span-2{grid-column:1/-1}
.field label{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,236,224,.55);font-weight:500}
.field label .req{color:var(--terra)}
.field input,.field select,.field textarea{
  width:100%;background:rgba(243,236,224,.04);border:1px solid rgba(243,236,224,.16);border-radius:1px;
  padding:.9rem 1rem;font-size:.9rem;color:var(--cream);transition:.4s var(--ease);font-weight:300;
  appearance:none;-webkit-appearance:none;
}
.field select{
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0a068' stroke-width='1.6'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 1rem center;background-size:16px;
  padding-right:2.6rem;cursor:pointer;
}
.field select option{background:var(--charcoal);color:var(--cream)}
.field textarea{resize:vertical;min-height:96px;line-height:1.6}
.field input::placeholder,.field textarea::placeholder{color:rgba(243,236,224,.28)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:rgba(243,236,224,.08)}
.field input[type="date"]{color-scheme:dark}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:#d2705a;background:rgba(210,112,90,.08)}
.error-msg{font-size:.7rem;color:#e0907a;letter-spacing:.04em;min-height:0;line-height:1.4;display:none}
.field.invalid .error-msg{display:block}
.form-note{font-size:.72rem;color:rgba(243,236,224,.4);line-height:1.65;margin-top:1rem;letter-spacing:.02em}
.res-form-wrap .btn{margin-top:1.5rem}
.form-success{
  position:absolute;inset:0;background:rgba(27,22,19,.98);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:2.5rem;gap:1rem;
  opacity:0;visibility:hidden;transform:translateY(12px);transition:.6s var(--ease-out);z-index:5;
}
.form-success.show{opacity:1;visibility:visible;transform:none}
.success-icon{
  width:70px;height:70px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
  color:var(--gold);font-size:1.6rem;margin-bottom:.5rem;animation:successPop .7s var(--ease-out) both;
}
@keyframes successPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.form-success h3{font-family:var(--serif);font-size:1.7rem;color:var(--cream)}
.form-success p{font-size:.88rem;color:rgba(243,236,224,.62);max-width:38ch;line-height:1.8}
.form-success .btn{margin-top:1rem}

/* ============================================================
   17. CONTACT
   ============================================================ */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2.5rem,5vw,4.5rem);align-items:start}
.contact-list{display:flex;flex-direction:column;gap:0;margin-top:2rem}
.contact-item{display:flex;gap:1.3rem;padding:1.5rem 0;border-bottom:1px solid var(--line);align-items:flex-start}
.contact-item:first-child{border-top:1px solid var(--line)}
.contact-item .ci-icon{
  width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:50%;color:var(--gold-deep);font-size:.9rem;transition:.45s var(--ease);
}
.contact-item:hover .ci-icon{background:var(--charcoal);color:var(--gold);border-color:var(--charcoal)}
.contact-item h4{
  font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
  font-weight:500;margin-bottom:.35rem;font-family:var(--sans);
}
.contact-item p,.contact-item a{font-size:.95rem;color:var(--text);line-height:1.7;transition:color .35s var(--ease)}
.contact-item a:hover{color:var(--gold-deep)}
.socials{display:flex;gap:.7rem;margin-top:2rem}
.social-link{
  width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;
  color:var(--text);transition:.45s var(--ease);font-size:.9rem;
}
.social-link:hover{background:var(--charcoal);color:var(--gold);border-color:var(--charcoal);transform:translateY(-3px)}
.contact-form-card{background:#fff;border:1px solid var(--line-soft);padding:clamp(1.6rem,3.2vw,2.6rem);box-shadow:var(--shadow-sm)}
.contact-form-card h3{font-family:var(--serif);font-size:1.6rem;margin-bottom:.4rem}
.contact-form-card .cf-sub{font-size:.86rem;color:var(--muted);margin-bottom:1.75rem}
.contact-form-card .field label{color:var(--muted)}
.contact-form-card .field input,.contact-form-card .field textarea{background:#fdfbf7;border-color:var(--line);color:var(--text)}
.contact-form-card .field input::placeholder,.contact-form-card .field textarea::placeholder{color:#b3a89c}
.contact-form-card .field input:focus,.contact-form-card .field textarea:focus{border-color:var(--gold);background:#fff}
.contact-form-card .field.invalid input,.contact-form-card .field.invalid textarea{border-color:#c96a55;background:#fdf3f0}
.contact-form-card .error-msg{color:#b5563f}
.contact-success{
  display:none;align-items:center;gap:.9rem;background:#f1f7f2;border:1px solid #cfe4d4;
  color:#3d6b4c;padding:1rem 1.2rem;font-size:.86rem;margin-top:1.2rem;border-radius:2px;
}
.contact-success.show{display:flex}
.contact-success i{font-size:1.1rem}
.map-wrap{
  margin-top:clamp(3rem,6vw,4.5rem);position:relative;height:clamp(300px,42vw,440px);overflow:hidden;
  border:1px solid var(--line);filter:grayscale(.4) contrast(1.05);transition:filter .7s var(--ease);
}
.map-wrap:hover{filter:grayscale(0) contrast(1)}
.map-wrap iframe{width:100%;height:100%;border:0;display:block}

/* ============================================================
   18. NEWSLETTER
   ============================================================ */
.newsletter{background:var(--cream);position:relative;overflow:hidden}
.newsletter::before{
  content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(192,160,104,.25);
  border-radius:50%;top:-260px;right:-160px;pointer-events:none;
}
.newsletter::after{
  content:"";position:absolute;width:340px;height:340px;border:1px solid rgba(192,160,104,.18);
  border-radius:50%;bottom:-200px;left:-120px;pointer-events:none;
}
.newsletter-inner{position:relative;z-index:2;max-width:760px;margin-inline:auto;text-align:center}
.newsletter h2{font-size:clamp(2rem,4.4vw,3.1rem);margin:1rem 0 1rem}
.newsletter p{color:var(--muted);max-width:52ch;margin-inline:auto;line-height:1.85}
.newsletter-form{display:flex;gap:.6rem;margin-top:2.2rem;max-width:520px;margin-inline:auto;flex-wrap:wrap}
.newsletter-form .field{flex:1;min-width:220px;text-align:left}
.newsletter-form input{
  background:#fff;border:1px solid var(--line);color:var(--text);padding:1.05rem 1.2rem;
  width:100%;font-size:.92rem;border-radius:1px;transition:.4s var(--ease);
}
.newsletter-form input::placeholder{color:#b3a89c}
.newsletter-form input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(192,160,104,.15)}
.newsletter-form .field.invalid input{border-color:#c96a55;background:#fdf3f0}
.newsletter-form .error-msg{color:#b5563f;text-align:left}
.newsletter-msg{margin-top:1.4rem;font-size:.86rem;color:#3d6b4c;display:none;align-items:center;justify-content:center;gap:.6rem}
.newsletter-msg.show{display:flex;animation:cardIn .5s var(--ease-out)}
.newsletter-note{margin-top:1.4rem;font-size:.72rem;color:var(--muted);opacity:.75}

/* ============================================================
   19. FOOTER
   ============================================================ */
.site-footer{background:var(--charcoal-deep);color:rgba(243,236,224,.62);padding:clamp(3.5rem,7vw,5.5rem) 0 0}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:clamp(2rem,4vw,3.5rem);padding-bottom:clamp(2.5rem,5vw,4rem)}
.footer-brand .brand{margin-bottom:1.4rem}
.footer-brand .brand-name{color:var(--cream);font-size:1.4rem}
.footer-brand .brand-sub{color:rgba(243,236,224,.45)}
.footer-brand p{font-size:.86rem;line-height:1.85;color:rgba(243,236,224,.5);max-width:34ch;margin-bottom:1.6rem}
.footer-col h4{
  font-family:var(--sans);font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold);font-weight:500;margin-bottom:1.4rem;
}
.footer-col ul{display:flex;flex-direction:column;gap:.75rem}
.footer-col a{font-size:.87rem;color:rgba(243,236,224,.55);transition:.35s var(--ease);display:inline-block}
.footer-col a:hover{color:var(--gold);transform:translateX(4px)}
.footer-contact li{font-size:.87rem;line-height:1.75;color:rgba(243,236,224,.55);display:flex;gap:.75rem;align-items:flex-start}
.footer-contact i{color:var(--gold);font-size:.8rem;margin-top:.35rem;width:14px;flex-shrink:0}
.footer-socials{display:flex;gap:.6rem;margin-top:1.6rem}
.footer-socials a{
  width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(243,236,224,.16);
  border-radius:50%;color:rgba(243,236,224,.7);font-size:.85rem;transition:.42s var(--ease);
}
.footer-socials a:hover{background:var(--gold);border-color:var(--gold);color:#1a1512;transform:translateY(-3px)}
.footer-bottom{
  border-top:1px solid rgba(243,236,224,.1);padding:1.6rem 0;display:flex;align-items:center;
  justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.78rem;color:rgba(243,236,224,.4);
}
.footer-bottom .legal{display:flex;gap:1.5rem;flex-wrap:wrap}
.footer-bottom .legal a{color:rgba(243,236,224,.4);transition:.35s var(--ease)}
.footer-bottom .legal a:hover{color:var(--gold)}

/* ============================================================
   20. CART DRAWER
   ============================================================ */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(10,8,6,.6);-webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);z-index:940;opacity:0;visibility:hidden;
  transition:opacity .5s var(--ease),visibility .5s;
}
.drawer-overlay.show{opacity:1;visibility:visible}
.cart-drawer{
  position:fixed;top:0;right:0;height:100%;height:100dvh;width:min(430px,100%);
  background:var(--ivory);z-index:950;display:flex;flex-direction:column;transform:translateX(102%);
  transition:transform .6s var(--ease-out);box-shadow:-30px 0 80px -40px rgba(0,0,0,.6);
}
.cart-drawer.open{transform:translateX(0)}
.cart-head{
  display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.5rem;
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.cart-head h2{font-family:var(--serif);font-size:1.5rem;display:flex;align-items:center;gap:.7rem}
.cart-head h2 .count-pill{
  font-family:var(--sans);font-size:.62rem;letter-spacing:.14em;background:var(--cream);
  color:var(--muted);padding:.25rem .6rem;border-radius:20px;font-weight:500;
}
.cart-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.1rem}
.cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1rem;padding:3rem 1rem;color:var(--muted)}
.cart-empty .ce-icon{width:80px;height:80px;border-radius:50%;border:1px dashed rgba(28,23,20,.2);display:grid;place-items:center;font-size:1.6rem;color:#c3b8a8;margin-bottom:.4rem}
.cart-empty h3{font-family:var(--serif);font-size:1.35rem;color:var(--text)}
.cart-empty p{font-size:.86rem;max-width:26ch;line-height:1.7}
.cart-item{
  display:grid;grid-template-columns:76px 1fr auto;gap:.9rem;padding-bottom:1.1rem;
  border-bottom:1px solid var(--line-soft);animation:cardIn .45s var(--ease-out) both;
}
.cart-item:last-child{border-bottom:none;padding-bottom:0}
.ci-thumb{width:76px;height:76px;overflow:hidden;background:var(--cream);border-radius:2px}
.ci-thumb img{width:100%;height:100%;object-fit:cover}
.ci-info{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.ci-name{font-family:var(--serif);font-size:1.02rem;line-height:1.3;color:var(--text)}
.ci-price{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.qty-row{display:flex;align-items:center;gap:.55rem;margin-top:.55rem}
.qty-btn{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:.65rem;color:var(--text);transition:.35s var(--ease)}
.qty-btn:hover{background:var(--charcoal);color:var(--cream);border-color:var(--charcoal)}
.qty-val{font-size:.85rem;min-width:20px;text-align:center;font-weight:500}
.ci-remove{align-self:flex-start;color:#b8aca0;font-size:.85rem;padding:.3rem;transition:.35s var(--ease)}
.ci-remove:hover{color:#b5563f;transform:scale(1.12)}
.ci-line-total{font-family:var(--serif);font-size:1.02rem;color:var(--charcoal);white-space:nowrap}
.cart-foot{border-top:1px solid var(--line);padding:1.4rem 1.5rem calc(1.4rem + env(safe-area-inset-bottom));background:var(--cream);flex-shrink:0}
.cart-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.35rem}
.cart-row span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cart-row strong{font-family:var(--serif);font-size:1.6rem;color:var(--charcoal);font-weight:500}
.cart-note{font-size:.7rem;color:var(--muted);line-height:1.6;margin:.6rem 0 1.1rem;opacity:.85}
.cart-foot .btn{margin-bottom:.7rem}
.cart-foot .btn-link{display:block;text-align:center;margin-inline:auto;font-size:.68rem}

/* ============================================================
   21. BACK TO TOP & TOAST
   ============================================================ */
.back-top{
  position:fixed;right:1.4rem;bottom:1.4rem;width:48px;height:48px;display:grid;place-items:center;
  background:var(--charcoal);color:var(--gold);border-radius:50%;z-index:800;opacity:0;visibility:hidden;
  transform:translateY(14px);transition:.5s var(--ease);box-shadow:var(--shadow-md);font-size:.9rem;
}
.back-top.show{opacity:1;visibility:visible;transform:none}
.back-top:hover{background:var(--gold);color:var(--charcoal)}
.toast-wrap{
  position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:2000;display:flex;
  flex-direction:column;gap:.6rem;align-items:center;pointer-events:none;width:min(420px,calc(100% - 2rem));
}
.toast{
  background:var(--charcoal);color:var(--cream);padding:.9rem 1.3rem;font-size:.82rem;
  letter-spacing:.03em;border-left:2px solid var(--gold);box-shadow:var(--shadow-md);
  display:flex;align-items:center;gap:.7rem;width:100%;animation:toastIn .5s var(--ease-out) both;border-radius:2px;
}
.toast i{color:var(--gold);font-size:.9rem}
.toast.hide{animation:toastOut .4s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

/* ============================================================
   22. SCROLL REVEAL
   ============================================================ */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .95s var(--ease-out),transform .95s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal-left{transform:translateX(-34px)}
.reveal-left.in{transform:none}
.reveal-right{transform:translateX(34px)}
.reveal-right.in{transform:none}

/* ============================================================
   23. RESPONSIVE
   ============================================================ */
@media (max-width:1180px){
  .nav-links{gap:1.4rem}
  .nav-links a{font-size:.72rem;letter-spacing:.1em}
  .why-grid{grid-template-columns:repeat(2,1fr)}
  .footer-grid{grid-template-columns:1.3fr 1fr 1fr;gap:2.5rem}
  .footer-col.footer-contact-col{grid-column:span 3}
  .footer-contact ul{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
}
@media (max-width:1024px){
  .nav-links{display:none}
  .nav-cta{display:none}
  .hamburger{display:flex}
  .brand-sub{display:none}
  .story-grid{grid-template-columns:1fr;gap:3rem}
  .story-images{max-width:560px;margin-inline:auto;width:100%}
  .story-img-sub{right:0}
  .specialty-grid{grid-template-columns:repeat(2,1fr)}
  .specialty-grid .specialty-card:last-child{grid-column:1/-1;min-height:380px}
  .res-grid{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
  .gallery-grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:170px}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:2rem}
}
@media (max-width:768px){
  :root{--nav-h:74px}
  .container{width:calc(100% - 2.25rem)}
  .site-header{padding:1rem 0}
  .site-header.scrolled{padding:.6rem 0}
  .brand-mark{width:38px;height:38px;font-size:.92rem}
  .brand-name{font-size:1.05rem}
  .hero-content{padding-top:calc(var(--nav-h) + 3rem)}
  .hero-title{max-width:100%}
  .hero-actions{gap:.75rem}
  .hero-actions .btn{flex:1 1 auto;min-width:170px;padding:.95rem 1.4rem;font-size:.66rem}
  .hero-meta{gap:1.6rem;margin-top:2.6rem}
  .hero-meta-item .v{font-size:1rem}
  .scroll-cue{display:none}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .why-grid{grid-template-columns:1fr}
  .gallery-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:.6rem}
  .g-wide{grid-column:span 2}
  .g-tall{grid-row:span 2}
  .form-grid{grid-template-columns:1fr}
  .field.span-2{grid-column:auto}
  .footer-grid{grid-template-columns:1fr 1fr}
  .footer-brand{grid-column:1/-1}
  .footer-col.footer-contact-col{grid-column:1/-1}
  .footer-contact ul{grid-template-columns:1fr;gap:.9rem}
  .footer-bottom{flex-direction:column;text-align:center;gap:1rem}
  .lb-nav{width:44px;height:44px}
  .lb-prev{left:.5rem}
  .lb-next{right:.5rem}
  .specialty-grid{grid-template-columns:1fr}
  .specialty-grid .specialty-card:last-child{grid-column:auto}
  .specialty-card{min-height:420px}
  .specialty-card .sp-desc{max-height:120px;opacity:1;margin-bottom:1rem}
  .cart-drawer{width:100%}
}
@media (max-width:520px){
  .hero-actions{flex-direction:column;align-items:stretch}
  .hero-actions .btn{width:100%}
  .menu-grid{grid-template-columns:1fr}
  .filter-btn{padding:.6rem 1.05rem;font-size:.62rem;letter-spacing:.12em}
  .stats-row{grid-template-columns:1fr 1fr;gap:1.6rem}
  .newsletter-form{flex-direction:column}
  .newsletter-form .btn{width:100%}
  .footer-grid{grid-template-columns:1fr}
  .gallery-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:132px}
  .story-badge{left:0;padding:1rem}
  .story-img-sub{width:52%;border-width:6px}
  .back-top{right:1rem;bottom:1rem;width:44px;height:44px}
  .toast-wrap{bottom:1rem}
  .testimonial-card{padding:1rem 0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
  .reveal{opacity:1 !important;transform:none !important}
  .hero-media img{animation:none}
}
</style>
</head>
<body>

<!-- ============ PAGE LOADER ============ -->
<div class="page-loader" id="pageLoader" aria-hidden="true">
  <span class="loader-mark" id="loaderMark">✦</span>
</div>

<!-- ============ HEADER ============ -->
<header class="site-header" id="siteHeader">
  <div class="nav-wrap">
    <a href="#home" class="brand" id="brandLink"></a>

    <nav class="nav-links" id="navLinks" aria-label="Primary navigation"></nav>

    <div class="nav-actions">
      <button class="cart-btn" id="cartToggle" aria-label="Open shopping cart" aria-haspopup="dialog">
        <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
        <span class="cart-count" id="cartCount" aria-live="polite">0</span>
      </button>
      <a href="#reservations" class="btn btn-gold nav-cta" id="navCta"></a>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ============ MOBILE MENU ============ -->
<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <button class="mm-close" id="mmClose" aria-label="Close menu">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
  <nav class="mm-links" id="mmLinks" aria-label="Mobile navigation"></nav>
  <div class="mm-footer">
    <a href="#reservations" class="btn btn-gold" id="mmCta"></a>
    <div class="mm-contact" id="mmContact"></div>
  </div>
</div>

<main>

  <!-- ============ HERO ============ -->
  <section class="hero" id="home">
    <div class="hero-media">
      <img id="heroImg" src="" alt="" fetchpriority="high" width="2000" height="1333">
    </div>
    <div class="hero-overlay"></div>

    <div class="container hero-content">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-lede" id="heroLede"></p>
      <div class="hero-actions" id="heroActions"></div>
      <div class="hero-meta" id="heroMeta"></div>
    </div>

    <a href="#story" class="scroll-cue" aria-label="Scroll to our story">
      <span class="bar" aria-hidden="true"></span>
      <span id="scrollCueText">Scroll</span>
    </a>
  </section>

  <!-- ============ MARQUEE ============ -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>

  <!-- ============ OUR STORY ============ -->
  <section class="section" id="story">
    <div class="container">
      <div class="story-grid">
        <div class="story-images reveal reveal-left">
          <div class="story-img-main">
            <img id="storyImgMain" src="" alt="" loading="lazy" width="900" height="1035">
          </div>
          <div class="story-img-sub">
            <img id="storyImgSub" src="" alt="" loading="lazy" width="600" height="600">
          </div>
          <div class="story-badge">
            <span class="num" id="storyBadgeNum"></span>
            <span class="lbl" id="storyBadgeLabel"></span>
          </div>
        </div>

        <div class="story-copy reveal reveal-right">
          <p class="eyebrow" id="storyEyebrow"></p>
          <h2 class="display section-title" id="storyTitle"></h2>
          <div id="storyParagraphs"></div>
          <blockquote class="story-quote" id="storyQuote"></blockquote>
          <div class="story-sign">
            <span class="sig" id="storySig"></span>
            <span class="role" id="storyRole"></span>
          </div>
        </div>
      </div>

      <div class="stats-row reveal" id="statsRow"></div>
    </div>
  </section>

  <!-- ============ SPECIALTIES ============ -->
  <section class="section section--dark specialties" id="specialties">
    <div class="container">
      <div class="section-head section-head--center reveal">
        <p class="eyebrow eyebrow--center" id="specEyebrow"></p>
        <h2 class="display section-title" id="specTitle"></h2>
        <p class="section-sub" id="specSub"></p>
      </div>

      <div class="specialty-grid" id="specialtyGrid"></div>

      <div class="specialties-cta reveal">
        <a href="#menu" class="btn btn-gold" id="specCta"></a>
      </div>
    </div>
  </section>

  <!-- ============ MENU ============ -->
  <section class="section" id="menu">
    <div class="container">
      <div class="section-head section-head--center reveal">
        <p class="eyebrow eyebrow--center" id="menuEyebrow"></p>
        <h2 class="display section-title" id="menuTitle"></h2>
        <p class="section-sub" id="menuSub"></p>
      </div>

      <div class="menu-toolbar reveal" id="menuToolbar" role="tablist" aria-label="Menu categories"></div>
      <div class="menu-grid" id="menuGrid" aria-live="polite"></div>
    </div>
  </section>

  <!-- ============ WHY CHOOSE US ============ -->
  <section class="section section--dark" id="why">
    <div class="container">
      <div class="section-head section-head--center reveal">
        <p class="eyebrow eyebrow--center" id="whyEyebrow"></p>
        <h2 class="display section-title" id="whyTitle"></h2>
        <p class="section-sub" id="whySub"></p>
      </div>
      <div class="why-grid reveal" id="whyGrid"></div>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <section class="section section--cream" id="gallery">
    <div class="container">
      <div class="section-head section-head--center reveal">
        <p class="eyebrow eyebrow--center" id="galleryEyebrow"></p>
        <h2 class="display section-title" id="galleryTitle"></h2>
        <p class="section-sub" id="gallerySub"></p>
      </div>
      <div class="gallery-grid reveal" id="galleryGrid"></div>
    </div>
  </section>

  <!-- ============ TESTIMONIALS ============ -->
  <section class="section section--dark testimonials" id="testimonials">
    <div class="container">
      <div class="section-head section-head--center reveal">
        <p class="eyebrow eyebrow--center" id="tstEyebrow"></p>
        <h2 class="display section-title" id="tstTitle"></h2>
      </div>

      <div class="slider reveal">
        <div class="slider-viewport">
          <div class="slider-track" id="sliderTrack"></div>
        </div>
        <div class="slider-nav">
          <button class="slider-arrow" id="prevSlide" aria-label="Previous testimonial">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>
          <div class="slider-dots" id="sliderDots" role="tablist" aria-label="Testimonial navigation"></div>
          <button class="slider-arrow" id="nextSlide" aria-label="Next testimonial">
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ RESERVATIONS ============ -->
  <section class="section reservation" id="reservations">
    <div class="reservation-bg">
      <img id="resBgImg" src="" alt="" loading="lazy" width="1800" height="1200">
    </div>

    <div class="container">
      <div class="res-grid">
        <div class="res-intro reveal reveal-left">
          <p class="eyebrow" id="resEyebrow"></p>
          <h2 class="display section-title" id="resTitle"></h2>
          <p id="resIntro"></p>
          <div id="resDetails"></div>
        </div>

        <div class="res-form-wrap reveal reveal-right">
          <form id="reservationForm" novalidate>
            <div class="form-grid" id="resFormGrid"></div>
            <button type="submit" class="btn btn-gold full" id="resSubmit"></button>
            <p class="form-note" id="resNote"></p>
          </form>

          <div class="form-success" id="reservationSuccess" role="status" aria-live="polite">
            <div class="success-icon"><i class="fa-solid fa-check" aria-hidden="true"></i></div>
            <h3 id="resSuccessTitle"></h3>
            <p id="resSuccessMessage"></p>
            <p style="font-size:.74rem;opacity:.65;max-width:36ch;" id="resSuccessNote"></p>
            <button type="button" class="btn btn-ghost-light" id="reservationReset"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="section" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <p class="eyebrow" id="ctEyebrow"></p>
        <h2 class="display section-title" id="ctTitle"></h2>
        <p class="section-sub" id="ctSub"></p>
      </div>

      <div class="contact-grid">
        <div class="reveal reveal-left">
          <div class="contact-list" id="contactList"></div>
          <div class="socials" id="contactSocials"></div>
        </div>

        <div class="contact-form-card reveal reveal-right">
          <h3 id="contactFormTitle"></h3>
          <p class="cf-sub" id="contactFormSub"></p>

          <form id="contactForm" novalidate>
            <div class="form-grid" id="contactFormGrid"></div>
            <button type="submit" class="btn btn-dark full" style="margin-top:1.25rem;" id="contactSubmit"></button>
            <div class="contact-success" id="contactSuccess" role="status" aria-live="polite">
              <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
              <span id="contactSuccessText"></span>
            </div>
          </form>
        </div>
      </div>

      <div class="map-wrap reveal">
        <iframe id="mapFrame" title="Restaurant location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>

  <!-- ============ NEWSLETTER ============ -->
  <section class="section section--tight newsletter">
    <div class="container">
      <div class="newsletter-inner reveal">
        <p class="eyebrow eyebrow--center" id="nlEyebrow"></p>
        <h2 class="display" id="nlTitle"></h2>
        <p id="nlText"></p>

        <form class="newsletter-form" id="newsletterForm" novalidate>
          <div class="field">
            <label for="nlEmail" class="sr-only">Email address</label>
            <input type="email" id="nlEmail" name="email" autocomplete="email" required>
            <span class="error-msg"></span>
          </div>
          <button type="submit" class="btn btn-dark" id="nlSubmit"></button>
        </form>

        <div class="newsletter-msg" id="newsletterMsg">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
          <span id="newsletterMsgText"></span>
        </div>

        <p class="newsletter-note" id="nlNote"></p>
      </div>
    </div>
  </section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <a href="#home" class="brand" id="footerBrand"></a>
        <p id="footerDesc"></p>
        <div class="footer-socials" id="footerSocials"></div>
      </div>

      <div class="footer-col">
        <h4 id="footerExploreTitle"></h4>
        <ul id="footerExploreLinks"></ul>
      </div>

      <div class="footer-col">
        <h4 id="footerMenuTitle"></h4>
        <ul id="footerMenuLinks"></ul>
      </div>

      <div class="footer-col footer-contact-col">
        <h4 id="footerContactTitle"></h4>
        <ul class="footer-contact" id="footerContactList"></ul>
      </div>
    </div>

    <div class="footer-bottom">
      <span id="footerCopyright"></span>
      <div class="legal" id="footerLegal"></div>
    </div>
  </div>
</footer>

<!-- ============ CART DRAWER ============ -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true">
  <div class="cart-head">
    <h2><span id="cartTitle"></span> <span class="count-pill" id="cartPill">0</span></h2>
    <button class="icon-btn" id="cartClose" aria-label="Close cart">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <div class="cart-body" id="cartBody"></div>

  <div class="cart-foot" id="cartFoot">
    <div class="cart-row">
      <span id="cartSubtotalLabel"></span>
      <strong id="cartSubtotal">$0.00</strong>
    </div>
    <p class="cart-note" id="cartNote"></p>
    <button class="btn btn-gold full" id="checkoutBtn"></button>
    <button class="btn-link" id="clearCartBtn"></button>
  </div>
</aside>

<!-- ============ LIGHTBOX ============ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image gallery viewer" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Close gallery">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">
    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
  </button>
  <figure class="lb-figure">
    <img id="lbImg" src="" alt="">
    <figcaption id="lbCaption"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">
    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
  </button>
</div>

<!-- ============ BACK TO TOP ============ -->
<button class="back-top" id="backTop" aria-label="Back to top">
  <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
</button>

<!-- ============ TOASTS ============ -->
<div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

<!-- ============ CONFIG (load first) ============ -->
<script src="config.js"></script>

<!-- ============ APP ============ -->
<script>
(function () {
  'use strict';

  const C = window.RESTAURANT_CONFIG;
  const $  = (s, c = document) => c.querySelector(s);
  const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, m => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
  const money = n => '$' + Number(n).toFixed(2);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!C) {
    document.body.innerHTML = '<div style="padding:5rem 2rem;font-family:sans-serif;text-align:center">' +
      '<h1>config.js not found</h1><p>Make sure config.js sits next to index.html.</p></div>';
    return;
  }

  /* ============================================================
     HEAD / SEO
     ============================================================ */
  function setMeta(sel, value) {
    const el = document.querySelector(sel);
    if (el && value) el.setAttribute('content', value);
  }

  function renderHead() {
    document.title = C.seo.title;
    document.documentElement.lang = C.locale.split('-')[0] || 'en';
    setMeta('meta[name="description"]', C.seo.description);
    setMeta('meta[name="theme-color"]', C.seo.themeColor);
    setMeta('meta[property="og:title"]', C.seo.title);
    setMeta('meta[property="og:description"]', C.seo.description);
    setMeta('meta[property="og:image"]', C.seo.ogImage);
    setMeta('meta[property="og:site_name"]', C.seo.siteName);
    setMeta('meta[name="twitter:title"]', C.seo.title);
    setMeta('meta[name="twitter:description"]', C.seo.description);
    setMeta('meta[name="twitter:image"]', C.seo.ogImage);
  }

  /* ============================================================
     CHROME (brand, nav, mobile menu, loader, cart labels)
     ============================================================ */
  function brandHTML() {
    return '<span class="brand-mark" aria-hidden="true">' + esc(C.brand.logoMark) + '</span>' +
      '<span class="brand-text">' +
        '<span class="brand-name">' + esc(C.brand.name) + '</span>' +
        '<span class="brand-sub">' + esc(C.brand.tagline) + '</span>' +
      '</span>';
  }

  function renderChrome() {
    /* loader */
    const loaderMark = $('#loaderMark');
    if (loaderMark) loaderMark.textContent = C.brand.logoMark;

    /* header brand */
    const brandLink = $('#brandLink');
    if (brandLink) {
      brandLink.innerHTML = brandHTML();
      brandLink.setAttribute('aria-label', C.brand.name + ' — Home');
    }

    /* footer brand */
    const footerBrand = $('#footerBrand');
    if (footerBrand) {
      footerBrand.innerHTML = brandHTML();
      footerBrand.setAttribute('aria-label', C.brand.name + ' — Home');
    }

    /* primary nav */
    $('#navLinks').innerHTML = C.nav.links.map(l =>
      '<a href="' + esc(l.href) + '" class="nav-link">' + esc(l.label) + '</a>'
    ).join('');

    /* nav cta */
    const navCta = $('#navCta');
    navCta.textContent = C.nav.cta.label;
    navCta.setAttribute('href', C.nav.cta.href);

    /* mobile nav */
    $('#mmLinks').innerHTML = C.nav.links.map((l, i) =>
      '<a href="' + esc(l.href) + '">' + esc(l.label) +
      ' <span>' + String(i + 1).padStart(2, '0') + '</span></a>'
    ).join('');

    const mmCta = $('#mmCta');
    mmCta.textContent = C.nav.cta.label;
    mmCta.setAttribute('href', C.nav.cta.href);

    $('#mmContact').innerHTML =
      '<a href="' + esc(C.contact.phoneHref) + '">' + esc(C.contact.phone) + '</a><br>' +
      '<a href="' + esc(C.contact.emailHref) + '">' + esc(C.contact.email) + '</a>';

    /* cart drawer labels */
    $('#cartTitle').textContent = C.ui.cart.title;
    $('#cartSubtotalLabel').textContent = C.ui.cart.subtotalLabel;
    $('#cartNote').textContent = C.ui.cart.note;
    $('#checkoutBtn').textContent = C.ui.cart.checkoutLabel;
    $('#clearCartBtn').textContent = C.ui.cart.clearLabel;
    $('#cartDrawer').setAttribute('aria-label', C.ui.cart.title);
  }

  /* ============================================================
     HERO
     ============================================================ */
  function renderHero() {
    $('#heroEyebrow').textContent = C.hero.eyebrow;
    $('#heroTitle').innerHTML =
      esc(C.hero.title.lead) + ' <em>' + esc(C.hero.title.accent) + '</em>';
    $('#heroLede').textContent = C.hero.lede;

    const heroImg = $('#heroImg');
    heroImg.src = C.hero.image;
    heroImg.alt = C.hero.imageAlt;

    $('#heroActions').innerHTML = C.hero.actions.map(a =>
      '<a href="' + esc(a.href) + '" class="btn btn-' + esc(a.style) + '">' +
        esc(a.label) +
        (a.icon ? ' <i class="fa-solid ' + esc(a.icon) + '" aria-hidden="true"></i>' : '') +
      '</a>'
    ).join('');

    $('#heroMeta').innerHTML = C.hero.meta.map(m =>
      '<div class="hero-meta-item">' +
        '<span class="k">' + esc(m.k) + '</span>' +
        '<span class="v">' + esc(m.v) + '</span>' +
      '</div>'
    ).join('');

    $('#scrollCueText').textContent = C.hero.scrollCue;
  }

  /* ============================================================
     MARQUEE
     ============================================================ */
  function renderMarquee() {
    const words = C.marquee.concat(C.marquee);
    $('#marqueeTrack').innerHTML = words.map(w => '<span>' + esc(w) + '</span>').join('');
  }

  /* ============================================================
     STORY
     ============================================================ */
  function renderStory() {
    const S = C.story;
    $('#storyEyebrow').textContent = S.eyebrow;
    $('#storyTitle').textContent = S.title;

    $('#storyImgMain').src = S.images.main.src;
    $('#storyImgMain').alt = S.images.main.alt;
    $('#storyImgSub').src = S.images.secondary.src;
    $('#storyImgSub').alt = S.images.secondary.alt;

    $('#storyBadgeNum').textContent = S.badge.number;
    $('#storyBadgeLabel').innerHTML = S.badge.labelLines.join('<br>');

    $('#storyParagraphs').innerHTML = S.paragraphs.map(p => '<p>' + esc(p) + '</p>').join('');
    $('#storyQuote').textContent = '“' + S.quote + '”';
    $('#storySig').textContent = S.signature.name;
    $('#storyRole').textContent = S.signature.role;

    $('#statsRow').innerHTML = S.stats.map(st =>
      '<div class="stat">' +
        '<div class="num">' +
          '<span class="counter" data-target="' + Number(st.value) + '">0</span>' +
          '<span class="suffix">' + esc(st.suffix || '') + '</span>' +
        '</div>' +
        '<span class="lbl">' + esc(st.label) + '</span>' +
      '</div>'
    ).join('');
  }

  /* ============================================================
     SPECIALTIES
     ============================================================ */
  function renderSpecialties() {
    const S = C.specialties;
    $('#specEyebrow').textContent = S.eyebrow;
    $('#specTitle').textContent = S.title;
    $('#specSub').textContent = S.subtitle;

    const cta = $('#specCta');
    cta.innerHTML = esc(S.cta.label) + ' <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
    cta.setAttribute('href', S.cta.href);

    $('#specialtyGrid').innerHTML = S.items.map((it, i) =>
      '<article class="specialty-card reveal" data-delay="' + (i * 120) + '">' +
        '<div class="sp-media">' +
          '<img src="' + esc(it.image) + '" alt="' + esc(it.alt) + '" loading="lazy" width="900" height="1200">' +
        '</div>' +
        '<div class="sp-body">' +
          '<span class="sp-label">' + esc(it.label) + '</span>' +
          '<h3 class="sp-name">' + esc(it.name) + '</h3>' +
          '<p class="sp-desc">' + esc(it.description) + '</p>' +
          '<span class="sp-price">' + esc(it.price) + '</span>' +
        '</div>' +
      '</article>'
    ).join('');
  }

  /* ============================================================
     MENU
     ============================================================ */
  const MENU_ITEMS = C.menu.items;

  function renderMenu() {
    const M = C.menu;
    $('#menuEyebrow').textContent = M.eyebrow;
    $('#menuTitle').textContent = M.title;
    $('#menuSub').textContent = M.subtitle;

    $('#menuToolbar').innerHTML = M.categories.map((cat, i) =>
      '<button class="filter-btn' + (i === 0 ? ' active' : '') + '"' +
        ' data-filter="' + esc(cat.id) + '" role="tab"' +
        ' aria-selected="' + (i === 0 ? 'true' : 'false') + '">' +
        esc(cat.label) +
      '</button>'
    ).join('');

    $('#menuGrid').innerHTML = MENU_ITEMS.map(item => {
      const tags = (item.tags || []).map(t =>
        '<span class="tag ' + esc(M.tagStyles[t] || 'tag-best') + '">' + esc(t) + '</span>'
      ).join('');

      return '<article class="menu-card" data-category="' + esc(item.category) + '">' +
        '<div class="thumb">' +
          '<img src="' + esc(item.image) + '" alt="' + esc(item.name) + '" loading="lazy" width="700" height="525">' +
          '<div class="tags">' + tags + '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-top">' +
            '<h3 class="dish-name">' + esc(item.name) + '</h3>' +
            '<span class="dish-price">$' + esc(item.price) + '</span>' +
          '</div>' +
          '<p class="dish-desc">' + esc(item.description) + '</p>' +
          '<button class="add-btn" data-id="' + esc(item.id) + '"' +
            ' aria-label="' + esc(C.ui.cart.addAria.replace('{name}', item.name)) + '">' +
            '<i class="fa-solid fa-plus" aria-hidden="true"></i> ' + esc(C.ui.cart.addLabel) +
          '</button>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  /* ============================================================
     WHY CHOOSE US
     ============================================================ */
  function renderWhy() {
    const W = C.why;
    $('#whyEyebrow').textContent = W.eyebrow;
    $('#whyTitle').textContent = W.title;
    $('#whySub').textContent = W.subtitle;

    $('#whyGrid').innerHTML = W.cards.map(c =>
      '<div class="why-card">' +
        '<div class="why-icon"><i class="' + esc(c.icon) + '" aria-hidden="true"></i></div>' +
        '<h3>' + esc(c.title) + '</h3>' +
        '<p>' + esc(c.description) + '</p>' +
      '</div>'
    ).join('');
  }

  /* ============================================================
     GALLERY
     ============================================================ */
  function renderGallery() {
    const G = C.gallery;
    $('#galleryEyebrow').textContent = G.eyebrow;
    $('#galleryTitle').textContent = G.title;
    $('#gallerySub').textContent = G.subtitle;

    $('#galleryGrid').innerHTML = G.items.map(it =>
      '<button class="g-item ' + esc(it.layout || '') + '"' +
        ' data-src="' + esc(it.full) + '"' +
        ' data-caption="' + esc(it.caption) + '"' +
        ' aria-label="' + esc('View: ' + it.caption) + '">' +
        '<img src="' + esc(it.thumb) + '" alt="' + esc(it.alt) + '" loading="lazy" width="700" height="500">' +
        '<span class="g-zoom"><i class="fa-solid fa-expand" aria-hidden="true"></i></span>' +
        '<span class="g-cap">' + esc(it.caption) + '</span>' +
      '</button>'
    ).join('');
  }

  /* ============================================================
     TESTIMONIALS
     ============================================================ */
  function renderTestimonials() {
    const T = C.testimonials;
    $('#tstEyebrow').textContent = T.eyebrow;
    $('#tstTitle').textContent = T.title;

    $('#sliderTrack').innerHTML = T.items.map(t => {
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += '<i class="fa-' + (i <= t.stars ? 'solid' : 'regular') + ' fa-star" aria-hidden="true"></i>';
      }
      return '<div class="slide">' +
        '<div class="testimonial-card">' +
          '<div class="t-stars" aria-label="Rated ' + t.stars + ' out of 5">' + stars + '</div>' +
          '<p class="t-quote">' + esc(t.quote) + '</p>' +
          '<div class="t-person">' +
            '<span class="t-avatar">' +
              '<img src="' + esc(t.avatar) + '" alt="' + esc('Portrait of ' + t.name) + '" loading="lazy" width="120" height="120">' +
            '</span>' +
            '<span>' +
              '<span class="t-name">' + esc(t.name) + '</span>' +
              '<span class="t-role">' + esc(t.role) + '</span>' +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ============================================================
     RESERVATIONS
     ============================================================ */
  function renderReservation() {
    const R = C.reservation;

    $('#resEyebrow').textContent = R.eyebrow;
    $('#resTitle').textContent = R.title;
    $('#resIntro').textContent = R.intro;

    $('#resBgImg').src = R.backgroundImage;
    $('#resBgImg').alt = R.backgroundAlt;

    $('#resDetails').innerHTML = R.details.map(d =>
      '<div class="res-detail">' +
        '<i class="' + esc(d.icon) + '" aria-hidden="true"></i>' +
        '<div>' +
          '<strong>' + esc(d.label) + '</strong>' +
          '<span>' + (d.href
            ? '<a href="' + esc(d.href) + '">' + esc(d.value) + '</a>'
            : esc(d.value)) + '</span>' +
        '</div>' +
      '</div>'
    ).join('');

    const F = R.fields;
    const req = '<span class="req">*</span>';

    $('#resFormGrid').innerHTML =
      '<div class="field span-2">' +
        '<label for="resName">' + esc(F.name.label) + ' ' + (F.name.required ? req : '') + '</label>' +
        '<input type="text" id="resName" name="name" placeholder="' + esc(F.name.placeholder) + '"' +
          ' autocomplete="' + esc(F.name.autocomplete || 'name') + '"' + (F.name.required ? ' required' : '') + '>' +
        '<span class="error-msg"></span>' +
      '</div>' +

      '<div class="field">' +
        '<label for="resEmail">' + esc(F.email.label) + ' ' + (F.email.required ? req : '') + '</label>' +
        '<input type="email" id="resEmail" name="email" placeholder="' + esc(F.email.placeholder) + '"' +
          ' autocomplete="' + esc(F.email.autocomplete || 'email') + '"' + (F.email.required ? ' required' : '') + '>' +
        '<span class="error-msg"></span>' +
      '</div>' +

      '<div class="field">' +
        '<label for="resPhone">' + esc(F.phone.label) + ' ' + (F.phone.required ? req : '') + '</label>' +
        '<input type="tel" id="resPhone" name="phone" placeholder="' + esc(F.phone.placeholder) + '"' +
          ' autocomplete="' + esc(F.phone.autocomplete || 'tel') + '"' + (F.phone.required ? ' required' : '') + '>' +
        '<span class="error-msg"></span>' +
      '</div>' +

      '<div class="field">' +
        '<label for="resGuests">' + esc(F.guests.label) + ' ' + (F.guests.required ? req : '') + '</label>' +
        '<select id="resGuests" name="guests"' + (F.guests.required ? ' required' : '') + '>' +
          '<option value="">' + esc(F.guests.placeholder) + '</option>' +
          F.guests.options.map(o => '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>').join('') +
        '</select>' +
        '<span class="error-msg"></span>' +
      '</div>' +

      '<div class="field">' +
        '<label for="resDate">' + esc(F.date.label) + ' ' + (F.date.required ? req : '') + '</label>' +
        '<input type="date" id="resDate" name="date"' + (F.date.required ? ' required' : '') + '>' +
        '<span class="error-msg"></span>' +
      '</div>' +

      '<div class="field">' +
        '<label for="resTime">' + esc(F.time.label) + ' ' + (F.time.required ? req : '') + '</label>' +
        '<select id="resTime" name="time"' + (F.time.required ? ' required' : '') + '>' +
          '<option value="">' + esc(F.time.placeholder) + '</option>' +
          F.time.options.map(t => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join('') +
        '</select>' +
        '<span class="error-msg"></span>' +
      '</div>' +

      '<div class="field span-2">' +
        '<label for="resNotes">' + esc(F.notes.label) + '</label>' +
        '<textarea id="resNotes" name="notes" rows="3" placeholder="' + esc(F.notes.placeholder) + '"></textarea>' +
        '<span class="error-msg"></span>' +
      '</div>';

    $('#resSubmit').innerHTML =
      esc(R.submitLabel) + ' <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
    $('#resNote').textContent = R.note;

    $('#resSuccessTitle').textContent = R.success.title;
